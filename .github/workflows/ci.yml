name: Davoodi Car QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - name: Offline market engine and API regression
        env:
          ADMIN_PASSWORD: ci-offline-only-test-password
          SESSION_SECRET: ci-offline-only-secret-longer-than-32-characters
          DB_PATH: /tmp/davoodi-ci.sqlite3
          AVALAI_API_KEY: ''
          OPENAI_API_KEY: ''
          SEARCH_COOLDOWN: '0'
          MAX_SEARCHES_PER_HOUR: '1000'
        run: |
          cd backend
          python test_v21_market_fix.py
          python test_v22_intelligence.py
          python test_v23_quality.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser-fallback regression (no external services)
        run: node qa/test_frontend.cjs
      - run: cd frontend && npm install --no-audit --no-fund
      - run: cd frontend && npm run build
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployable Dockerfile
        run: docker build -t davoodi-car:v23 .
