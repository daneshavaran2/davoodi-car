name: Davoodi Car CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend
      - name: Offline backend tests
        env:
          ADMIN_PASSWORD: local-ci-test-value
          SESSION_SECRET: local-ci-secret-1234567890-1234567890-1234567890
        run: |
          cd backend
          python test_v21_market_fix.py
          python test_v22_intelligence.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm install --no-audit --no-fund
      - run: cd frontend && npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t davoodi-car:v22 .
