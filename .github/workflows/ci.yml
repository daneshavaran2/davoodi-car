name: Davoodi Car QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - name: Market data safety, API and Playwright extractor regression
        env:
          ADMIN_PASSWORD: ci-offline-only-test-password
          SESSION_SECRET: ci-offline-only-secret-longer-than-32-characters
          DB_PATH: /tmp/davoodi-ci.sqlite3
          AVALAI_API_KEY: ''
          OPENAI_API_KEY: ''
          SEARCH_COOLDOWN: '0'
          MAX_SEARCHES_PER_HOUR: '1000'
          MARKET_FETCH_MODE: http
        run: |
          cd backend
          python test_v21_market_fix.py
          python test_v22_intelligence.py
          python test_v23_quality.py
          python test_v24_safety.py
          python test_v26_playwright.py
          python test_v27_reliability.py
          python test_v28_name_only.py
  playwright-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser-rendered JS fixture test in real Chromium
        env:
          BROWSER_TEST_REQUIRED: '1'
        run: cd backend && python test_v26_playwright.py && python test_v27_reliability.py && python test_v28_name_only.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node qa/test_frontend.cjs
          node qa/test_v24_ux.cjs
          node qa/test_v25_quick_glance.mjs
      - run: cd frontend && npm install --no-audit --no-fund
      - run: cd frontend && npm run build
  docker:
    needs: [backend, playwright-browser, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployable frontend and Chromium image
        run: docker build -t davoodi-car:v28 .
